[www]
; Mantém as variáveis de ambiente do container (DB_*, APP_URL...) visíveis para o PHP.
clear_env = no
listen = 9000
pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 500
catch_workers_output = yes
decorate_workers_output = no
