services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    # Senha de root só é usada dentro do container (script de init abaixo);
    # a aplicação nunca se conecta como root — veja backend/docker/mysql-init.
    environment:
      MYSQL_ROOT_PASSWORD: root_dev_only
    env_file:
      - ./backend/.env
    volumes:
      - iba_mysql_data:/var/lib/mysql
      - ./backend/docker/mysql-init:/docker-entrypoint-initdb.d:ro
    # Sem publicar porta no host: backend e adminer acessam pela rede interna
    # do Docker (host "db"). Se precisar de um client MySQL do host, rode:
    #   docker compose exec db mysql -u iba_migrate -p iba
    # ou publique a porta só localmente via docker-compose.override.yml.
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    # Sem env_file aqui de propósito: backend/.env é lido direto pelo PHP
    # (Env::load, a cada request, via bind-mount abaixo). Se o valor também
    # virasse env var do container (via env_file), Env::load o ignoraria
    # (getenv() já setado) e editar o .env em disco não teria mais efeito
    # sem recriar o container.
    environment:
      # Dentro da rede do Docker o MySQL é o serviço "db", não 127.0.0.1.
      DB_HOST: db
      DB_PORT: 3306
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8765}:80"
    volumes:
      - ./backend:/var/www/html
      - iba_backend_vendor:/var/www/html/vendor

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    environment:
      VITE_API_PROXY_TARGET: http://backend:80
      # Domínio(s) público(s) atrás do reverse proxy, se houver (ex.: nginx
      # com TLS). Separe por vírgula. Vazio = só localhost (padrão do Vite).
      VITE_ALLOWED_HOSTS: ${VITE_ALLOWED_HOSTS:-}
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - iba_frontend_node_modules:/app/node_modules

  # Administração visual do MySQL (sistema: MySQL, servidor: db)
  adminer:
    image: adminer:latest
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      - db
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8082}:8080"

volumes:
  iba_mysql_data:
  iba_backend_vendor:
  iba_frontend_node_modules:
