# =============================================================================
#  Irmãos da Bola Academy — PRODUÇÃO (VPS) e teste local da imagem final
#  Configuração em .env.prod. Use pelo Makefile: make local | make deploy | make help
#  (O docker-compose.yml é o ambiente de DESENVOLVIMENTO, com hot-reload.)
# =============================================================================
name: iba

x-app-env: &app-env
  APP_ENV: production
  APP_DEBUG: "false"
  APP_URL: ${APP_URL:-https://${DOMAIN}}
  APP_TIMEZONE: ${TZ:-America/Sao_Paulo}
  TZ: ${TZ:-America/Sao_Paulo}
  DB_HOST: db
  DB_PORT: "3306"
  DB_DATABASE: ${DB_DATABASE}
  DB_USERNAME: ${DB_USERNAME}
  DB_PASSWORD: ${DB_PASSWORD}
  DB_MIGRATE_USERNAME: ${DB_MIGRATE_USERNAME}
  DB_MIGRATE_PASSWORD: ${DB_MIGRATE_PASSWORD}
  SESSION_SECURE: ${SESSION_SECURE:-true}
  SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES:-30}
  SESSION_ABSOLUTE_HOURS: ${SESSION_ABSOLUTE_HOURS:-8}
  INVOICE_DUE_DAY: ${INVOICE_DUE_DAY:-10}
  ADMIN_NAME: ${ADMIN_NAME:-Administrador}
  ADMIN_EMAIL: ${ADMIN_EMAIL:-}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}

services:
  web:
    build: { context: ., target: web }
    image: iba-web:latest
    restart: unless-stopped
    depends_on:
      api: { condition: service_started }
    ports:
      # Atrás de reverse proxy: HTTP_BIND=127.0.0.1 (porta só local, o proxy acessa)
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${HTTPS_BIND:-0.0.0.0}:${HTTPS_PORT:-443}:443"
      - "${HTTPS_BIND:-0.0.0.0}:${HTTPS_PORT:-443}:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-${DOMAIN}}
      ACME_EMAIL: ${ACME_EMAIL}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-private_ranges}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks: [frontend, backend]

  api:
    build: { context: ., target: api }
    image: iba-api:latest
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment: *app-env
    volumes:
      - app_logs:/app/storage/logs
    networks: [backend]

  scheduler:
    image: iba-api:latest
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
      api: { condition: service_started }
    entrypoint: ["/usr/local/bin/iba-scheduler"]
    environment:
      <<: *app-env
      AUTO_INVOICES: ${AUTO_INVOICES:-false}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - app_logs:/app/storage/logs
      - backups:/backups
    networks: [backend]

  db:
    image: mysql:8.0
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=-03:00
      - --innodb-buffer-pool-size=${MYSQL_BUFFER_POOL:-256M}
      - --max-connections=60
      - --skip-name-resolve
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_MIGRATE_USERNAME: ${DB_MIGRATE_USERNAME}
      DB_MIGRATE_PASSWORD: ${DB_MIGRATE_PASSWORD}
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    # Sem "ports": o banco NÃO fica exposto na internet.
    networks: [backend]

networks:
  frontend: {}
  backend: { internal: true }

volumes:
  db_data: {}
  caddy_data: {}
  caddy_config: {}
  app_logs: {}
  backups: {}
